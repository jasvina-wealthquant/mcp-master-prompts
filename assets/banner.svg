<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="MCP Master Prompts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f1a"/>
      <stop offset="1" stop-color="#12332b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd3a0"/>
      <stop offset="1" stop-color="#2fa37a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <!-- network motif: one prompt node fanning out to tool servers -->
  <g stroke="#5fd3a0" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M930 200 C1010 200 1030 110 1110 110"/>
    <path d="M930 200 C1010 200 1030 170 1110 170"/>
    <path d="M930 200 C1010 200 1030 230 1110 230"/>
    <path d="M930 200 C1010 200 1030 290 1110 290"/>
  </g>
  <circle cx="930" cy="200" r="34" fill="#0b1f1a" stroke="url(#accent)" stroke-width="3"/>
  <text x="930" y="208" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#5fd3a0">&gt;_</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#cfeee0">
    <rect x="1110" y="94" width="120" height="32" rx="8" fill="#163d33" stroke="#2fa37a"/><text x="1170" y="115" text-anchor="middle">web</text>
    <rect x="1110" y="154" width="120" height="32" rx="8" fill="#163d33" stroke="#2fa37a"/><text x="1170" y="175" text-anchor="middle">markets</text>
    <rect x="1110" y="214" width="120" height="32" rx="8" fill="#163d33" stroke="#2fa37a"/><text x="1170" y="235" text-anchor="middle">code</text>
    <rect x="1110" y="274" width="120" height="32" rx="8" fill="#163d33" stroke="#2fa37a"/><text x="1170" y="295" text-anchor="middle">media</text>
  </g>
  <text x="80" y="150" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#5fd3a0" letter-spacing="4">MCP</text>
  <text x="80" y="215" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff">Master Prompts</text>
  <text x="80" y="265" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#a9cfc0">Prompts that make AI agents use their tools well.</text>
  <text x="80" y="300" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#a9cfc0">Research, markets, code, content and media.</text>
  <rect x="80" y="330" width="120" height="4" rx="2" fill="url(#accent)"/>
</svg>
